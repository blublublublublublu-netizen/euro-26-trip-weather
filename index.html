<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trip Weather – Central Europe Apr 5–11, 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 1rem;
      background: #0f172a;
      color: #e5e7eb;
    }
    h1, h2 {
      text-align: center;
      margin: 0.5rem 0;
    }
    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 1rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
    }
    .card {
      background: #020617;
      border-radius: 0.75rem;
      padding: 0.9rem 1rem 1rem;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
    }
    .city {
      font-weight: 600;
      font-size: 1.05rem;
    }
    .country {
      font-size: 0.8rem;
      color: #9ca3af;
    }
    .status {
      font-size: 0.8rem;
      color: #f97316;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      padding: 0.25rem 0.3rem;
      text-align: left;
      border-bottom: 1px solid #111827;
      vertical-align: top;
    }
    th {
      font-weight: 500;
      color: #9ca3af;
      font-size: 0.8rem;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .date {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .temps {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .desc {
      font-size: 0.8rem;
    }
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #6b7280;
    }
    .updated {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 0.25rem;
    }
    .error {
      color: #fca5a5;
      font-size: 0.8rem;
      margin-top: 0.3rem;
    }
    .spinner {
      border: 2px solid rgba(148, 163, 184, 0.3);
      border-top: 2px solid #e5e7eb;
      border-radius: 50%;
      width: 13px;
      height: 13px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      margin-right: 0.25rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    button.refresh {
      display: block;
      margin: 0 auto 0.75rem;
      background: #1d4ed8;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 0.45rem 1.1rem;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }
    button.refresh:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Trip Weather</h1>
    <h2>Central Europe · 5–11 Apr 2026</h2>
    <p class="subtitle">Shows only the cities and dates from your itinerary · Data from Open‑Meteo.</p>
    <button class="refresh" onclick="loadAll()">Refresh forecast</button>
    <p class="updated" id="updated"></p>
    <div class="cards" id="cards"></div>
    <p class="footer">Uses free Open‑Meteo Weather & Geocoding APIs · No key needed · For personal trip use only.</p>
  </div>

  <script>
    const locations = [
      { label: 'Vienna', query: 'Vienna, Austria' },
      { label: 'Český Krumlov', query: 'Cesky Krumlov, Czechia' },
      { label: 'Prague', query: 'Prague, Czechia' },
      { label: 'Bratislava', query: 'Bratislava, Slovakia' },
      { label: 'Budapest', query: 'Budapest, Hungary' }
    ];

    // Only dates you actually care about per place
    const dateFilter = {
      'Vienna': ['2026-04-05', '2026-04-06'],
      'Český Krumlov': ['2026-04-06', '2026-04-07'],
      'Prague': ['2026-04-07', '2026-04-08', '2026-04-09'],
      'Bratislava': ['2026-04-09'],
      'Budapest': ['2026-04-09', '2026-04-10']
    };

    const tripStart = '2026-04-05';
    const tripEnd   = '2026-04-11';

    const weatherCodeMap = {
      0:  { text: 'Clear sky', icon: '☀️' },
      1:  { text: 'Mainly clear', icon: '🌤️' },
      2:  { text: 'Partly cloudy', icon: '⛅' },
      3:  { text: 'Overcast', icon: '☁️' },
      45: { text: 'Fog', icon: '🌫️' },
      48: { text: 'Rime fog', icon: '🌫️' },
      51: { text: 'Light drizzle', icon: '🌦️' },
      53: { text: 'Drizzle', icon: '🌦️' },
      55: { text: 'Heavy drizzle', icon: '🌧️' },
      56: { text: 'Freezing drizzle', icon: '🌧️' },
      57: { text: 'Freezing drizzle', icon: '🌧️' },
      61: { text: 'Light rain', icon: '🌧️' },
      63: { text: 'Rain', icon: '🌧️' },
      65: { text: 'Heavy rain', icon: '🌧️' },
      66: { text: 'Freezing rain', icon: '🌧️' },
      67: { text: 'Freezing rain', icon: '🌧️' },
      71: { text: 'Snow', icon: '❄️' },
      73: { text: 'Snow', icon: '❄️' },
      75: { text: 'Heavy snow', icon: '❄️' },
      77: { text: 'Snow grains', icon: '❄️' },
      80: { text: 'Showers', icon: '🌦️' },
      81: { text: 'Heavy showers', icon: '🌧️' },
      82: { text: 'Violent showers', icon: '🌧️' },
      85: { text: 'Snow showers', icon: '❄️' },
      86: { text: 'Snow showers', icon: '❄️' },
      95: { text: 'Thunderstorm', icon: '⛈️' },
      96: { text: 'Storm & hail', icon: '⛈️' },
      99: { text: 'Storm & heavy hail', icon: '⛈️' }
    };

    function createCardSkeleton(location) {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${location.label.replace(/\s+/g, '-')}`;
      card.innerHTML = `
        <div class="card-header">
          <div>
            <div class="city">${location.label}</div>
            <div class="country">${location.query}</div>
          </div>
          <div class="status"><span class="spinner"></span>Loading…</div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Weather</th>
              <th>Temp</th>
              <th>Rain%</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="error"></div>
      `;
      return card;
    }

    async function geocode(query) {
      const url = new URL('https://geocoding-api.open-meteo.com/v1/search');
      url.searchParams.set('name', query);
      url.searchParams.set('count', '1');
      url.searchParams.set('language', 'en');
      url.searchParams.set('format', 'json');
      const res = await fetch(url.toString());
      if (!res.ok) throw new Error('Geocoding error');
      const data = await res.json();
      if (!data.results || !data.results.length) throw new Error('Location not found');
      return data.results[0];
    }

    async function fetchForecast(lat, lon) {
      const url = new URL('https://api.open-meteo.com/v1/forecast');
      url.searchParams.set('latitude', lat);
      url.searchParams.set('longitude', lon);
      url.searchParams.set('daily', 'weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max');
      url.searchParams.set('timezone', 'auto');
      url.searchParams.set('start_date', tripStart);
      url.searchParams.set('end_date', tripEnd);
      const res = await fetch(url.toString());
      if (!res.ok) throw new Error('Forecast error');
      return res.json();
    }

    async function loadLocation(location) {
      const cardId = `card-${location.label.replace(/\s+/g, '-')}`;
      const card = document.getElementById(cardId);
      const status = card.querySelector('.status');
      const tbody = card.querySelector('tbody');
      const errorDiv = card.querySelector('.error');
      status.innerHTML = '<span class="spinner"></span>Loading…';
      errorDiv.textContent = '';
      tbody.innerHTML = '';

      try {
        const geo = await geocode(location.query);
        const forecast = await fetchForecast(geo.latitude, geo.longitude);
        const d = forecast.daily;
        if (!d || !d.time || !d.time.length) {
          status.textContent = 'No data';
          return;
        }
        status.textContent = 'Updated';
        const wantedDates = dateFilter[location.label] || [];
        for (let i = 0; i < d.time.length; i++) {
          const date = d.time[i];
          if (!wantedDates.includes(date)) continue; // skip dates you don't care about
          const code = d.weathercode[i];
          const tMin = d.temperature_2m_min[i];
          const tMax = d.temperature_2m_max[i];
          const rain = d.precipitation_probability_max ? d.precipitation_probability_max[i] : null;
          const info = weatherCodeMap[code] || { text: 'N/A', icon: '' };
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="date">${date}</td>
            <td class="desc">${info.icon} ${info.text}</td>
            <td class="temps">${Math.round(tMin)}–${Math.round(tMax)}°C</td>
            <td>${rain != null ? rain + '%' : '–'}</td>
          `;
          tbody.appendChild(tr);
        }
        if (!tbody.hasChildNodes()) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td colspan="4" class="desc">No selected dates for this city.</td>';
          tbody.appendChild(tr);
        }
      } catch (err) {
        console.error(err);
        status.textContent = 'Error';
        errorDiv.textContent = 'Could not load forecast. Try again later.';
      }
    }

    async function loadAll() {
      const cardsContainer = document.getElementById('cards');
      if (!cardsContainer.hasChildNodes()) {
        locations.forEach(loc => cardsContainer.appendChild(createCardSkeleton(loc)));
      }
      locations.forEach(loc => loadLocation(loc));
      const updated = document.getElementById('updated');
      updated.textContent = 'Last refreshed: ' + new Date().toLocaleString();
    }

    window.addEventListener('DOMContentLoaded', loadAll);
  </script>
</body>
</html>
